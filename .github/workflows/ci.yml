name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_e2e:
        description: "Run the live OpenCode E2E (requires an OpenCode binary and provider credentials)"
        required: true
        default: false
        type: boolean
      run_factory_e2e:
        description: "Run the canonical Factory Droid E2E (requires droid and OPENAI_API_KEY)"
        required: true
        default: false
        type: boolean

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run docs:check
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high

  e2e-opencode:
    name: Real E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_e2e == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require OpenCode
        run: command -v opencode
      - run: npm run e2e:real

  e2e-factory:
    name: Real E2E (Factory Droid, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_factory_e2e == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned Factory Droid
        run: npm install --global droid@0.222.0
      - name: Verify Factory Droid version
        run: test "$(droid --version)" = "0.222.0"
      - name: Configure OpenAI BYOK model
        run: |
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'JSON'
          {
            "customModels": [{
              "model": "gpt-5.6-terra",
              "id": "custom:gpt-5.6-terra-1",
              "displayName": "HackOn OpenAI",
              "baseUrl": "https://api.openai.com/v1",
              "apiKey": "${OPENAI_API_KEY}",
              "provider": "openai",
              "maxOutputTokens": 128000
            }]
          }
          JSON
      - run: npm run e2e:factory
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HACKON_DROID_MODEL: custom:gpt-5.6-terra-1
          HACKON_EXPECTED_DROID_VERSION: 0.222.0
